# xcodegen spec for the iPhone app. From this folder: `xcodegen generate`, then build the CharaMonitorIOS scheme.
# The art, packs, voice and setup file checks come from the repo's Swift package (CharaCore); the Mac app's own
# spec is ../project.yml.
name: CharaMonitorIOS
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
packages:
  DogMonitor:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""   # the 10-character Team ID, for a device build
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CharaMonitorIOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: en.lproj
        buildPhase: resources
    dependencies:
      - package: DogMonitor
        product: CharaCore
      - target: CharaWidgets
    settings:
      base:
        PRODUCT_NAME: CharaMonitor
        PRODUCT_BUNDLE_IDENTIFIER: com.jelly.charamonitor.ios
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/CharaMonitorIOS.entitlements
  CharaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: en.lproj
        buildPhase: resources
    dependencies:
      - package: DogMonitor
        product: CharaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: CharaWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.jelly.charamonitor.ios.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/CharaWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  CharaMonitorIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: App/Mood.swift
    dependencies:
      - package: DogMonitor
        product: CharaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jelly.charamonitor.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CharaMonitorIOS:
    build:
      targets:
        CharaMonitorIOS: all
    test:
      targets:
        - CharaMonitorIOSTests
    run:
      config: Debug
